<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Abidas</title>
    <style>
        body {
            background-color: black;
            font-family: Arial, Helvetica, sans-serif;
        }

        h1 {
            color: white;
            text-align: center;
        }

        main {
            background-color: white;
            margin: auto;
            height: 74vh;
            width: 83vw;
        }

        form {
            padding: 10px;
        }
    </style>
</head>
<body>
    <h1>ABIDAS</h1>
    <main>
        <form action="entrada.php" autocomplete="on" method="post">
            <fieldset>
                <legend>Dados Pessoais</legend>
                <p>
                    <label for="inome">Nome: </label>
                    <input type="text" name="nome" id="inome" required placeholder="Nome Completo" minlength="10" maxlength="33" autocomplete="name">
                </p>
                <p>
                    <label for="inas">Data de Nascimento: </label>
                    <input type="date" name="nas" id="inas" required autocomplete="bday">
                </p>
                <p>
                    <label for="imail">Email: </label>
                    <input type="email" name="mail" id="imail" required autocomplete="email">
                </p>
                <p>
                    <label for="icpf">CPF: </label>
                    <input type="number" name="cpf" id="icpf" required>
                </p>
            </fieldset>
                <p>
                    <input type="submit" value="Cadastrar">
                    <input type="reset" value="Limpar">
                </p>
            
        </form>
    </main>
</body>
</html>
